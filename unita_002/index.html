    <!-- ========================================================================= -->
    <!-- SCRIPT 1: LA CASSAFORTE DEL LOGIN (BLINDATO) -->
    <!-- Nessun errore futuro potrà mai bloccare questo script -->
    <!-- ========================================================================= -->
    <script type="module">
        import { RegistroCorso } from "../studenti.js";
        
        // Legge chi è connesso
        const myUserName = localStorage.getItem('parlo_italiano_username') || "";
        const myGroup = localStorage.getItem('parlo_italiano_group') || "default";
        
        // Nasconde il login se siamo già connessi
        const logOverlay = document.getElementById('login-overlay');
        if (myUserName && logOverlay) {
            logOverlay.style.display = 'none';
        }

        // Funzione per entrare
        window.entraInClasse = function() {
            const usrInp = document.getElementById('username-input');
            const grpInp = document.getElementById('group-select');
            if (!usrInp || !grpInp) return;
            
            const nameInput = usrInp.value.trim();
            const groupInput = grpInp.value;

            const gruppoInfo = RegistroCorso[groupInput];
            if (!gruppoInfo || !gruppoInfo.studenti.find(s => s.toLowerCase() === nameInput.toLowerCase())) {
                return alert("Accesso negato o gruppo errato.");
            }

            localStorage.setItem('parlo_italiano_username', nameInput); 
            localStorage.setItem('parlo_italiano_group', groupInput);
            location.reload(); 
        };

        // Funzione per uscire
        window.esciDallaClasse = function() {
            if (confirm("Vuoi uscire dalla classe?")) {
                localStorage.removeItem('parlo_italiano_username');
                localStorage.removeItem('parlo_italiano_group');
                location.reload();
            }
        };
    </script>


    <!-- ========================================================================= -->
    <!-- SCRIPT 2: IL MOTORE DELLA LEZIONE E FIREBASE (Modificabile in futuro) -->
    <!-- ========================================================================= -->
    <script type="module">
        import { initLezione } from "./motore-lezione.js";
        import { ConfigLezione } from "./dati-lezione.js";
        import { RegistroCorso } from "../studenti.js";
        import { db } from "../config-firebase.js";
        import { getDatabase, ref, set, onValue, push, remove, update, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        
        // Recupera i dati utente
        const myUserName = localStorage.getItem('parlo_italiano_username') || "";
        const myGroup = localStorage.getItem('parlo_italiano_group') || "default";
        const mySessionId = "user_" + Math.random().toString(36).substr(2, 9);

     let isDocente = false;
        const gruppoCorrente = RegistroCorso[myGroup];
        if (gruppoCorrente) {
            const userLow = myUserName.toLowerCase();
            
            // Controlliamo in modo sicuro se l'utente ha il ruolo di docente o supporto nella lista (array)
            const ruoliDocente = Array.isArray(gruppoCorrente.docenteRuolo) ? gruppoCorrente.docenteRuolo : [];
            const ruoliSupporto = Array.isArray(gruppoCorrente.docenteSupporto) ? gruppoCorrente.docenteSupporto : [];
            
            if (ruoliDocente.some(d => d.toLowerCase() === userLow) || ruoliSupporto.some(s => s.toLowerCase() === userLow)) {
                isDocente = true;
            }
        }

        // ==========================================
// LISTA STUDENTI DEL GRUPPO CORRENTE
// ==========================================

let listaStudenti = [];

if (gruppoCorrente) {
    const ruoliDocente = Array.isArray(gruppoCorrente.docenteRuolo) ? gruppoCorrente.docenteRuolo.map(r => r.toLowerCase()) : [];
    const ruoliSupporto = Array.isArray(gruppoCorrente.docenteSupporto) ? gruppoCorrente.docenteSupporto.map(r => r.toLowerCase()) : [];
    
    listaStudenti = gruppoCorrente.studenti.filter(nome => {
        const nomeLow = nome.toLowerCase();
        return !ruoliDocente.includes(nomeLow) && !ruoliSupporto.includes(nomeLow);
    });
}

window.listaStudenti = listaStudenti;

console.log('📋 Studenti disponibili:', listaStudenti);

        
        
        // Blocca l'esecuzione se non siamo loggati (lo script 1 gestisce il login)
        if (!myUserName) throw new Error("Utente non loggato. Attesa login.");
        

        // ==========================================
        // INIZIALIZZAZIONE MOTORE LEZIONE
        // ==========================================
        const BASE_PATH = `${ConfigLezione?.idFirebase || "lezione_default"}/${myGroup}`;
        
        // 1. AVVIAMO IL MOTORE! (Creerà i titoli e la grafica in automatico)
        initLezione(ConfigLezione, {
            myUserName: myUserName,
            myGroup: myGroup,
            isDocente: isDocente
        });


        // ==========================================
        // FUNZIONI DI SUPPORTO (Lavagna, UI)
        // ==========================================
        

        window.toggleAccordion = function(id) {
    const content = document.getElementById('content_' + id);
    const arrow = content.previousElementSibling.querySelector('span');
    
    if (content.style.display === "block") {
        content.style.display = "none";
        arrow.innerText = "▼";
        // Rimuoviamo il salvataggio quando chiudiamo
        localStorage.removeItem('last_open_accordion'); 
    } else {
        content.style.display = "block";
        arrow.innerText = "▲";
        // Salviamo l'ID della scheda aperta
        localStorage.setItem('last_open_accordion', id); 
    }
};

        window.scrollSlider = function(direction) {
            const container = document.getElementById('flashcard-slider');
            if (container) container.scrollBy({ left: direction * (container.offsetWidth * 0.7), behavior: 'smooth' });
        };

       window.scrollSliderCibo = function(direction) {
    const container = document.getElementById('flashcard-slider-cibo');
    if (!container) return;
    
    // Calcola la larghezza di una card + gap
    const cardWidth = container.querySelector('.flashcard-item')?.offsetWidth || 160;
    const gap = 15;
    const scrollAmount = (cardWidth + gap) * direction;
    
    container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
};

     
     window.scrollSliderBevande = function(direction) {
    const container = document.getElementById('flashcard-slider-bevande');
    if (!container) return;
    
    const cardWidth = container.querySelector('.flashcard-item')?.offsetWidth || 160;
    const gap = 15;
    const scrollAmount = (cardWidth + gap) * direction;
    
    container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
};

        

        // ==========================================
        // GENERAZIONE HTML DOM 
        // ==========================================
        



     // --- AUTO-RIPRISTINO SCHEDA APERTA ---
window.addEventListener('load', () => {
    const lastOpen = localStorage.getItem('last_open_accordion');
    if (lastOpen) {
        const el = document.getElementById('content_' + lastOpen);
        if (el) {
            el.style.display = 'block';
            const header = el.previousElementSibling;
            if(header) {
                header.querySelector('span').innerText = "▲";
            }
        }
    }
});

     

        // ==========================================
        // LOGICA FIREBASE: BACHECA MESSAGGI
        // ==========================================
        window.eliminaMessaggio = function(boardKey, messageId) { if(confirm("Vuoi cancellare questo messaggio?")) remove(ref(db, `${BASE_PATH}/messages_${boardKey}/${messageId}`)); };


        


// ==========================================
// LOGICA CATEGORIE ETÀ
// ==========================================

// Funzione per scegliere una categoria
window.scegliCategoria = function(categoriaId) {
    // Evidenzia l'immagine cliccata
    document.querySelectorAll('[id^="img_cat_"]').forEach(img => {
        img.style.borderColor = '#ddd';
        img.style.borderWidth = '3px';
    });
    const img = document.getElementById(`img_cat_${categoriaId}`);
    if (img) {
        img.style.borderColor = 'var(--primary-color)';
        img.style.borderWidth = '4px';
    }
    
    // Trova la categoria selezionata
    const categoria = ConfigLezione.elicitazione.categorieEta.find(c => c.id === categoriaId);
    if (!categoria) return;
    
    // Mostra le opzioni di genere
    const container = document.getElementById('container_opzioni_genere');
    if (!container) return;
    
    container.innerHTML = `
        <div style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px; border: 2px solid var(--primary-color);">
            <p style="font-weight: bold; margin-bottom: 10px;">✍️ Scegli la tua risposta:</p>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                ${categoria.opzioni.map(opt => `
                    <button onclick="confermaCategoria('${categoriaId}', '${opt.valore}', '${opt.etichetta}')" 
                            style="padding: 12px 24px; border: 2px solid #ddd; border-radius: 8px; background: white; cursor: pointer; font-size: 1.1em; transition: all 0.3s ease;"
                            onmouseover="this.style.borderColor='var(--primary-color)'; this.style.transform='scale(1.05)'" 
                            onmouseout="this.style.borderColor='#ddd'; this.style.transform='scale(1)'">
                        ${opt.etichetta}
                    </button>
                `).join('')}
            </div>
        </div>
    `;
};

        window.confermaCategoria = function(categoriaId, valore, etichetta) {
    // Salva su Firebase con stato 'verde'
    set(ref(db, `${BASE_PATH}/categorie_eta/${myUserName}`), {
        categoria: categoriaId,
        valore: valore,
        etichetta: etichetta,
        nome: myUserName,
        stato: 'verde',
        timestamp: Date.now()
    });
    
    // Pulisci il container delle opzioni (senza messaggi)
    const container = document.getElementById('container_opzioni_genere');
    if (container) {
        container.innerHTML = '';
    }
};

        // Ascoltatore per le scelte degli studenti (categorie età)
onValue(ref(db, `${BASE_PATH}/categorie_eta`), (snapshot) => {
    const data = snapshot.val() || {};
    
    // ==========================================
    // 1. AGGIORNA I NOMI SOTTO LE CATEGORIE
    // ==========================================
    const categorieNomi = {};
    Object.keys(data).forEach(userId => {
        const item = data[userId];
        if (item.stato === 'verde') {
            if (!categorieNomi[item.categoria]) {
                categorieNomi[item.categoria] = [];
            }
            categorieNomi[item.categoria].push({
                nome: item.nome,
                userId: userId,
                valore: item.valore,
                etichetta: item.etichetta
            });
        }
    });
    
    // Aggiorna i nomi sotto ogni categoria
    if (ConfigLezione?.elicitazione?.categorieEta) {
        ConfigLezione.elicitazione.categorieEta.forEach(cat => {
            const container = document.getElementById(`nomi_cat_${cat.id}`);
            if (container) {
                const utenti = categorieNomi[cat.id] || [];
                if (utenti.length === 0) {
                    container.innerHTML = '';
                } else {
                    container.innerHTML = `
                        <div style="font-size: 0.85em; color: var(--text-color); margin-top: 5px;">
                            ${utenti.map(u => {
                                if (u.userId === myUserName) {
                                    return `<span style="display: block; color: var(--primary-color); font-weight: bold;">Io sono ${u.valore}</span>`;
                                } else {
                                    const verbo = u.nome.endsWith('a') ? 'è' : 'è';
                                    return `<span style="display: block;">${u.nome} ${verbo} ${u.valore}</span>`;
                                }
                            }).join('')}
                        </div>
                    `;
                }
            }
        });
    }
    
    // ==========================================
    // 2. AGGIORNA IL TABELLONE GENERALE
    // ==========================================
    const tabellone = document.getElementById('contenuto_tabellone_categorie');
    if (tabellone) {
        // Raccogli tutte le risposte approvate (stato === 'verde')
        const risposteApprovate = Object.keys(data)
            .filter(userId => data[userId].stato === 'verde')
            .map(userId => ({
                userId: userId,
                ...data[userId]
            }));
        
        if (risposteApprovate.length === 0) {
            tabellone.innerHTML = '<p style="color: #999; font-style: italic; text-align: center;">Nessuna risposta ancora... Sii il primo!</p>';
        } else {
            let html = '<div style="display: flex; flex-direction: column; gap: 5px;">';
            risposteApprovate.forEach(item => {
                if (item.userId === myUserName) {
                    // Prima persona per lo studente stesso
                    html += `<div style="padding: 6px 12px; background: #d4edda; border-radius: 6px; border-left: 4px solid #28a745;">
                                <span style="font-weight: bold;">Io</span> sono ${item.valore}
                            </div>`;
                } else {
                    // Terza persona per gli altri
                    const verbo = item.nome.endsWith('a') ? 'è' : 'è';
                    html += `<div style="padding: 6px 12px; background: white; border-radius: 6px; border: 1px solid #eee;">
                                <span style="font-weight: bold;">${item.nome}</span> ${verbo} ${item.valore}
                            </div>`;
                }
            });
            html += '</div>';
            tabellone.innerHTML = html;
        }
    }
    
    // ==========================================
    // 3. PANNELLO DOCENTE
    // ==========================================
    if (isDocente) {
        const panel = document.getElementById('risposte_categorie_docente');
        if (!panel) return;
        
        const risposte = Object.keys(data).filter(userId => data[userId].stato === 'verde');
        
        if (risposte.length === 0) {
            panel.innerHTML = '<p style="color: #999; font-style: italic;">Nessuna risposta ricevuta.</p>';
            return;
        }
        
        let html = '';
        risposte.forEach(userId => {
            const item = data[userId];
            html += `
                <div style="display: flex; justify-content: space-between; align-items: center; padding: 5px 0; border-bottom: 1px solid #eee;">
                    <span>
                        <b>${item.nome}</b>: ${item.etichetta} → "${item.valore}"
                        <span style="font-size:0.8em; color:#27ae60;">✅</span>
                    </span>
                    <button onclick="eliminaRispostaCategoria('${userId}')" 
                            style="background:#e74c3c; color:white; border:none; border-radius:4px; padding:2px 8px; cursor:pointer;" 
                            title="Cancella la risposta di ${item.nome}">
                        ✖️
                    </button>
                </div>
            `;
        });
        panel.innerHTML = html;
    }
});
        

// Funzione per eliminare la risposta di un singolo utente (SOLO DOCENTE)
window.eliminaRispostaCategoria = function(userId) {
    if (!confirm(`⚠️ Cancellare la risposta di questo studente?`)) {
        return;
    }
    
    remove(ref(db, `${BASE_PATH}/categorie_eta/${userId}`))
        .then(() => {
            console.log(`Risposta eliminata per: ${userId}`);
        })
        .catch((error) => {
            console.error("Errore durante l'eliminazione:", error);
            alert("❌ Errore durante l'eliminazione.");
        });
};


     // ==========================================
// LOGICA BRAINSTORMING (FORUM RISPOSTE)
// ==========================================

// Funzione per salvare la risposta
window.salvaRispostaBrainstorming = function(attivitaId) {
    const textarea = document.getElementById(`textarea_brainstorming_${attivitaId}`);
    if (!textarea) return;
    
    const testo = textarea.value.trim();
    if (testo === "") {
        alert("Scrivi qualcosa prima di salvare!");
        return;
    }
    
    // Salva su Firebase (set sovrascrive la risposta dello studente)
    set(ref(db, `${BASE_PATH}/brainstorming/${attivitaId}/${myUserName}`), {
        testo: testo,
        author: myUserName,
        timestamp: Date.now(),
        likes: {}  // Inizializza l'oggetto likes vuoto
    });
    
    // Disabilita la textarea
    textarea.disabled = true;
    
    // Nasconde pulsante Salva, mostra Modifica
    document.getElementById(`btn_salva_brainstorming_${attivitaId}`).style.display = 'none';
    document.getElementById(`btn_modifica_brainstorming_${attivitaId}`).style.display = 'inline-block';
};

// Funzione per modificare la risposta
window.modificaRispostaBrainstorming = function(attivitaId) {
    const textarea = document.getElementById(`textarea_brainstorming_${attivitaId}`);
    if (!textarea) return;
    
    // Abilita la textarea
    textarea.disabled = false;
    textarea.focus();
    
    // Nasconde pulsante Modifica, mostra Salva
    document.getElementById(`btn_modifica_brainstorming_${attivitaId}`).style.display = 'none';
    document.getElementById(`btn_salva_brainstorming_${attivitaId}`).style.display = 'inline-block';
};

// Funzione per gestire il "Mi piace"
window.mettiLikeBrainstorming = function(attivitaId, userId) {
    // Non permettere like sulla propria risposta
    if (userId === myUserName) {
        alert("Non puoi mettere 'Mi piace' alla tua risposta!");
        return;
    }
    
    const likeRef = ref(db, `${BASE_PATH}/brainstorming/${attivitaId}/${userId}/likes/${myUserName}`);
    
    // Leggi lo stato attuale del like
    get(likeRef).then((snapshot) => {
        const haGiaMessoLike = snapshot.val() === true;
        // Toggle: se ha già messo like, lo toglie; altrimenti lo aggiunge
        set(likeRef, !haGiaMessoLike);
    });
};

// Funzione per eliminare una risposta (solo docente)
window.eliminaRispostaBrainstorming = function(attivitaId, userId) {
    if (!confirm(`⚠️ Cancellare la risposta di questo studente?`)) {
        return;
    }
    remove(ref(db, `${BASE_PATH}/brainstorming/${attivitaId}/${userId}`));
};

     // Funzione per convertire un numero in lettere (da 0 a 100)
window.convertiNumeroInLettere = function(numero) {
    if (!ConfigLezione?.elicitazione?.numeriEta) return "";
    const found = ConfigLezione.elicitazione.numeriEta.find(item => item.numero === parseInt(numero));
    return found ? found.lettere : "";
};

     // Funzione per salvare l'età (versione speciale per "eta")
window.salvaEta = function(attivitaId) {
    const input = document.getElementById(`input_eta_${attivitaId}`);
    if (!input) return;
    
    const eta = parseInt(input.value.trim());
    if (isNaN(eta) || eta < 0 || eta > 100) {
        alert("Inserisci un numero valido tra 0 e 100!");
        return;
    }
    
    const lettere = window.convertiNumeroInLettere(eta);
    if (!lettere) {
        alert("Numero non riconosciuto!");
        return;
    }
    
    // Salva su Firebase con il testo già formattato
    // Lo studente vedrà "Io ho X anni." nella sua risposta
    set(ref(db, `${BASE_PATH}/brainstorming/${attivitaId}/${myUserName}`), {
        eta: eta,
        lettere: lettere,
        author: myUserName,
        timestamp: Date.now(),
        likes: {}
    });
    
    // Disabilita l'input e mostra i pulsanti giusti
    input.disabled = true;
    document.getElementById(`btn_salva_eta_${attivitaId}`).style.display = 'none';
    document.getElementById(`btn_modifica_eta_${attivitaId}`).style.display = 'inline-block';
    
    // Aggiorna l'anteprima
    const preview = document.getElementById(`anteprima_eta_${attivitaId}`);
    if (preview) {
        preview.innerHTML = `📝 In lettere: <strong>${lettere}</strong> anni`;
    }
};

     // Funzione per modificare l'età
window.modificaEta = function(attivitaId) {
    const input = document.getElementById(`input_eta_${attivitaId}`);
    if (!input) return;
    
    input.disabled = false;
    input.focus();
    
    document.getElementById(`btn_modifica_eta_${attivitaId}`).style.display = 'none';
    document.getElementById(`btn_salva_eta_${attivitaId}`).style.display = 'inline-block';
};

    // --- ANTEPRIMA IN TEMPO REALE PER L'ETÀ ---
// Questo codice aggiorna automaticamente l'anteprima in lettere mentre lo studente scrive
const inputEta = document.getElementById('input_eta_eta');
if (inputEta) {
    inputEta.addEventListener('input', function() {
        const eta = parseInt(this.value);
        const preview = document.getElementById('anteprima_eta_eta');
        const btnSalva = document.getElementById('btn_salva_eta_eta');
        
        if (preview) {
            if (isNaN(eta) || eta < 0 || eta > 100) {
                preview.innerHTML = '📝 In lettere: <span style="color: #999; font-weight: normal;">Inserisci un numero valido (0-100)...</span>';
                if (btnSalva) btnSalva.style.display = 'none';
            } else {
                const lettere = window.convertiNumeroInLettere(eta);
                if (lettere) {
                    preview.innerHTML = `📝 In lettere: <strong>${lettere}</strong> anni`;
                    // Mostra il pulsante Salva quando il numero è valido
                    if (btnSalva) btnSalva.style.display = 'inline-block';
                }
            }
        }
    });
}
     
     

// --- ASCOLTATORE: Risposte brainstorming ---
ConfigLezione.elicitazione.domandeBrainstorming?.forEach(item => {
    const attivitaId = item.id;
    
    onValue(ref(db, `${BASE_PATH}/brainstorming/${attivitaId}`), (snapshot) => {
        const data = snapshot.val() || {};
        const container = document.getElementById(`risposte_brainstorming_${attivitaId}`);
        if (!container) return;
        
        const sortedKeys = Object.keys(data).sort((a, b) => (data[a].timestamp || 0) - (data[b].timestamp || 0));
        
        if (sortedKeys.length === 0) {
            container.innerHTML = '<p style="color: #999; font-style: italic;">Ancora nessuna risposta...</p>';
            return;
        }
        
        let html = '';
        sortedKeys.forEach(userId => {
            const item = data[userId];
            const likesCount = item.likes ? Object.values(item.likes).filter(v => v === true).length : 0;
            const haMessoLike = item.likes && item.likes[myUserName] === true;
            
            let testoMostrato;
            if (attivitaId === "eta") {
                if (userId === myUserName) {
                    testoMostrato = `Io ho ${item.eta} anni.`;
                } else {
                    testoMostrato = `${item.author} ha ${item.eta} anni.`;
                }
            } else {
                testoMostrato = item.testo;
            }
            
            const deleteBtn = isDocente ? `
                <button onclick="eliminaRispostaBrainstorming('${attivitaId}', '${userId}')" 
                        style="background: #e74c3c; color: white; border: none; border-radius: 4px; padding: 2px 10px; cursor: pointer; font-size: 0.8em;">
                    ✖️
                </button>
            ` : '';

window.verificaCompletamentoDecine = function() {
    // Prendi i dati della Fase 3 da ConfigLezione
    const fase3 = ConfigLezione?.numeri?.fase3;
    if (!fase3 || !fase3.esercizio) return;
    
    const ex = fase3.esercizio;
    let errori = 0;
    let completati = 0;
    let vuoti = 0;
    let totali = ex.spazi.length;
    
    // Controlla ogni campo di input e SALVA SOLO SE NON È VUOTO
    ex.spazi.forEach(s => {
        const input = document.getElementById(`completamento3_${s.posizione}`);
        if (!input) return;
        
        const risposta = input.value.trim().toLowerCase();
        const corretta = s.rispostaCorretta.toLowerCase();
        
        // 🔥 SALVA SU FIREBASE SOLO SE LA RISPOSTA NON È VUOTA
        if (risposta !== "") {
            set(ref(db, `${BASE_PATH}/numeri/decine/${s.posizione}/${myUserName}`), risposta);
        } else {
            // Se è vuota, RIMUOVI da Firebase
            remove(ref(db, `${BASE_PATH}/numeri/decine/${s.posizione}/${myUserName}`));
        }
        
        // 🆕 FUNZIONE PER VERIFICARE SE È CORRETTO (CON VARIANTI)
        function isCorretto(risposta, corretta) {
            // Se la risposta è esattamente uguale alla corretta
            if (risposta === corretta) return true;
            
            // Verifica se il numero finisce in 3 (es. ventitré, trentatré, ecc.)
            const finisceInTre = corretta.endsWith('tré') || corretta.endsWith('tre');
            
            if (finisceInTre) {
                // Varianti accettate per i numeri che finiscono in 3
                const varianti = [
                    corretta,                          // ventitré (accento corretto)
                    corretta.replace('é', 'è'),        // ventitrè (accento grave)
                    corretta.replace('é', 'e') + "'",  // ventitre' (apostrofo)
                    corretta.replace('é', 'e')         // ventitre (senza accento - accettato ma con avviso)
                ];
                
                // Controlla se la risposta è una delle varianti
                const match = varianti.find(v => v === risposta);
                if (match) {
                    // Se la risposta è "ventitre" (senza accento), aggiungiamo un avviso
                    if (risposta === corretta.replace('é', 'e')) {
                        // Segnaliamo che è accettata ma con suggerimento
                        return { corretto: true, avviso: true, formaCorretta: corretta };
                    }
                    return { corretto: true, avviso: false };
                }
            }
            
            return { corretto: false, avviso: false };
        }
        
        // Verifica la risposta
        const risultato = isCorretto(risposta, corretta);
        const isCorrect = risultato && (risultato.corretto || risultato === true);
        const haAvviso = risultato && risultato.avviso;
        
        // Evidenzia il campo
        if (risposta === "") {
            input.style.borderColor = '#f39c12';
            input.style.backgroundColor = '#fff3cd';
            vuoti++;
        } else if (isCorrect) {
            input.style.borderColor = '#28a745';
            input.style.backgroundColor = '#d4edda';
            completati++;
            
            // Se ha un avviso sull'accento, aggiungiamo un'etichetta
            if (haAvviso) {
                // Cerchiamo se esiste già un avviso per questo input
                let avviso = input.parentElement.querySelector('.avviso-accento');
                if (!avviso) {
                    avviso = document.createElement('div');
                    avviso.className = 'avviso-accento';
                    avviso.style.cssText = 'font-size: 0.85em; color: #f39c12; margin-top: 2px; font-style: italic;';
                    input.parentElement.appendChild(avviso);
                }
                avviso.innerHTML = `⚠️ Attenzione all'accento! La forma corretta è <strong>${corretta}</strong>`;
            }
        } else {
            input.style.borderColor = '#dc3545';
            input.style.backgroundColor = '#f8d7da';
            errori++;
            
            // Rimuovi eventuali avvisi precedenti
            const avviso = input.parentElement.querySelector('.avviso-accento');
            if (avviso) avviso.remove();
        }
    });
    
    // Mostra il feedback DETTAGLIATO
    const feedback = document.getElementById('feedback_completamento_decine');
    if (feedback) {
        if (completati === totali && errori === 0 && vuoti === 0) {
            feedback.innerHTML = `<span style="color: #28a745;">🎉 Perfetto! Tutti i numeri sono corretti.</span>`;
        } else if (completati > 0 && errori === 0 && vuoti === 0) {
            feedback.innerHTML = `<span style="color: #28a745;">✅ Ottimo! Hai completato tutti i numeri.</span>`;
        } else {
            // Mostra il riepilogo dettagliato
            let messaggio = '';
            if (completati > 0) messaggio += `✅ ${completati} corretti`;
            if (errori > 0) messaggio += ` ${messaggio ? '|' : ''} ❌ ${errori} da correggere`;
            if (vuoti > 0) messaggio += ` ${messaggio ? '|' : ''} ⚠️ ${vuoti} da completare`;
            
            const colore = errori > 0 ? '#dc3545' : (vuoti > 0 ? '#f39c12' : '#28a745');
            feedback.innerHTML = `<span style="color: ${colore}; font-weight: bold;">${messaggio}</span>`;
        }
    }
};

window.verificaDateImportanti = function() {

    const fase4 = ConfigLezione?.numeri?.fase4;
    if (!fase4 || !fase4.sfidaDate) return;
    
    const sf = fase4.sfidaDate;
    let errori = 0;
    let completati = 0;
    let vuoti = 0;
    let totali = sf.date.length;
    
    // Controlla ogni campo di input
    sf.date.forEach(d => {
        const input = document.getElementById(`completamento_date_${d.anno}`);
        if (!input) return;
        
        const risposta = input.value.trim().toLowerCase();
        
        // Gestisce sia stringa che array per rispostaCorretta

            variantiAccettate = d.rispostaCorretta.map(v => v.toLowerCase());

            variantiAccettate = [d.rispostaCorretta.toLowerCase()];
        }
        
        const isCorrect = variantiAccettate.some(v => v === risposta);
        
        // SALVA SU FIREBASE SOLO SE LA RISPOSTA NON È VUOTA
        if (risposta !== "") {
            set(ref(db, `${BASE_PATH}/numeri/date/${d.anno}/${myUserName}`), risposta);

            // Se è vuota, RIMUOVI da Firebase
            remove(ref(db, `${BASE_PATH}/numeri/date/${d.anno}/${myUserName}`));

        // Evidenzia il campo
        if (risposta === "") {
            input.style.borderColor = '#f39c12';
            input.style.backgroundColor = '#fff3cd';
            vuoti++;
        } else if (isCorrect) {
            input.style.borderColor = '#28a745';
            input.style.backgroundColor = '#d4edda';

            input.style.borderColor = '#dc3545';
            input.style.backgroundColor = '#f8d7da';

    const feedback = document.getElementById('feedback_date_importanti');

        if (completati === totali && errori === 0 && vuoti === 0) {
            feedback.innerHTML = `<span style="color: #28a745;">🎉 Perfetto! Tutte le date sono corrette.</span>`;

// CAROSELLO PERSONAGGI (Fase 9)
// ==========================================

window.scrollPersonaggi = function(direction) {
    const container = document.getElementById('carosello_personaggi');
    if (!container) return;
    
    // Calcola la larghezza di una card (compreso il gap)
    const card = container.querySelector('div');
    if (!card) return;
    const cardWidth = card.offsetWidth;
    const gap = 20;
    const scrollAmount = (cardWidth + gap) * direction;
    
    container.scrollBy({ left: scrollAmount, behavior: 'smooth' });
    
    // Aggiorna gli indicatori dopo lo scroll
    setTimeout(aggiornaIndicatori, 300);
};

function aggiornaIndicatori() {
    const container = document.getElementById('carosello_personaggi');
    if (!container) return;
    
    const cards = container.querySelectorAll('div');
    if (cards.length === 0) return;
    
    const scrollLeft = container.scrollLeft;
    const cardWidth = cards[0].offsetWidth;
    const gap = 20;
    const indexCorrente = Math.round(scrollLeft / (cardWidth + gap));
    
    cards.forEach((_, index) => {
        const dot = document.getElementById(`dot_${index}`);
        if (dot) {
            dot.style.background = index === indexCorrente ? '#9b59b6' : '#ddd';
            dot.style.transform = index === indexCorrente ? 'scale(1.3)' : 'scale(1)';
        }
    });
}

// Ascolta lo scroll manuale per aggiornare gli indicatori
document.addEventListener('DOMContentLoaded', function() {
    const container = document.getElementById('carosello_personaggi');
    if (container) {
        container.addEventListener('scroll', aggiornaIndicatori);
    }
});

// FUNZIONE: Genera cartelle per tutti gli studenti
// ==========================================

function generaCartellePerTutti() {
    const f5 = ConfigLezione?.numeri?.fase5;
    if (!f5) return;
    
    // Ottieni la lista degli studenti dal registro
    const gruppoCorrente = RegistroCorso[myGroup];
    if (!gruppoCorrente) return;
    
    // Filtra per escludere i docenti e i ruoli di supporto
    const ruoliDocente = Array.isArray(gruppoCorrente.docenteRuolo) ? gruppoCorrente.docenteRuolo.map(r => r.toLowerCase()) : [];
    const ruoliSupporto = Array.isArray(gruppoCorrente.docenteSupporto) ? gruppoCorrente.docenteSupporto.map(r => r.toLowerCase()) : [];
    
    const studenti = gruppoCorrente.studenti.filter(nome => {
        const nomeLow = nome.toLowerCase();
        return !ruoliDocente.includes(nomeLow) && !ruoliSupporto.includes(nomeLow);
    });
    
    // Per ogni studente, genera una cartella con 6 numeri casuali
    studenti.forEach(nome => {
        const numeri = generaNumeriCasuali(f5.numeriPerCartella, f5.numeriMin, f5.numeriMax);
        const cartellaRef = ref(db, `${BASE_PATH}/tombola/cartelle/${nome}`);
        set(cartellaRef, {
            numeri: numeri,
            segnati: []  // Inizialmente nessun numero segnato
        });
    });
    
    // Genera anche la cartella per lo studente corrente (se non è docente)
    if (!isDocente) {
        const numeri = generaNumeriCasuali(f5.numeriPerCartella, f5.numeriMin, f5.numeriMax);
        cartellaStudente = numeri;
        numeriSegnati = [];
        aggiornaCartellaUI();
    } else {
        // Se è docente, non ha una cartella (ma potrebbe voler vedere una demo)
        cartellaStudente = [];
        numeriSegnati = [];
    }
}

// ==========================================
// FUNZIONE: Genera numeri casuali unici
// ==========================================

function generaNumeriCasuali(quanti, min, max) {
    const numeri = [];
    const disponibili = [];
    for (let i = min; i <= max; i++) {
        disponibili.push(i);
    }
    
    // Mescola l'array e prendi i primi 'quanti'
    for (let i = disponibili.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [disponibili[i], disponibili[j]] = [disponibili[j], disponibili[i]];
    }
    
    // Prendi i primi 'quanti' e ordinali
    const selezionati = disponibili.slice(0, quanti);
    selezionati.sort((a, b) => a - b);
    return selezionati;
}

window.toggleNumero = function(numero) {
    // Non permettere interazioni se lo studente non ha una cartella
    if (cartellaStudente.length === 0) {
        alert("⏳ Non hai ancora una cartella. Attendi che il docente inizi la partita!");

    }
    
    // Verifica se il numero è nella cartella
    if (!cartellaStudente.includes(numero)) {
        return; // Non fare nulla se il numero non è nella cartella
    }
    
    // Toggle: se è segnato, deseleziona; se non è segnato, seleziona
    const index = numeriSegnati.indexOf(numero);
    if (index > -1) {
        numeriSegnati.splice(index, 1); // Rimuovi
    } else {
        numeriSegnati.push(numero); // Aggiungi
    }
    
    // Salva su Firebase
    const cartellaRef = ref(db, `${BASE_PATH}/tombola/cartelle/${myUserName}`);
    update(cartellaRef, {
        segnati: numeriSegnati
    });
    
    // Aggiorna l'UI
    aggiornaCartellaUI();
};

// ==========================================
// FUNZIONE: Converti numero in lettere (usa ConfigLezione)
// ==========================================

function convertiNumeroInLettere(numero) {
    // Cerca nel dizionario dei numeri (da elicitazione)
    const numeriEta = ConfigLezione?.elicitazione?.numeriEta;
    if (numeriEta) {
        const found = numeriEta.find(item => item.numero === numero);
        if (found) return found.lettere;
    }
    
    // Se non trova, restituisci il numero in cifre
    return numero.toString();
}

                            [arrayBase[i], arrayBase[j]] = [arrayBase[j], arrayBase[i]];
                        }
                        // Salviamo l'ordine mescolato su Firebase e ci fermiamo qui (ripartirà da solo)
                        set(dbRef, arrayBase);

        window.spostaFrase = function(exId, currentIndex, direzione) {
            const dbRef = ref(db, `${BASE_PATH}/riordino/${exId}/ordine`);
            get(dbRef).then((snapshot) => {
                if (snapshot.exists()) {
                    let ordine = snapshot.val();
                    let nuovoIndex = currentIndex + direzione;
                    
                    // Scambiamo di posto i due numeri nell'array
                    let temp = ordine[currentIndex];
                    ordine[currentIndex] = ordine[nuovoIndex];
                    ordine[nuovoIndex] = temp;
                    
                    // Salviamo su Firebase (la magia fa aggiornare gli schermi in tempo reale!)
                    set(dbRef, ordine);
                }
            });

// Invia risposta (salva o aggiorna)
window.inviaRispostaScrittura = function(campoId) {
    const input = document.getElementById(`input_scrittura_${campoId}`);
    if (!input) return;
    
    const testo = input.value.trim();
    if (testo === "") {
        alert("Scrivi qualcosa prima di salvare!");
        return;
    }
    
    // Verifica che la frase contenga "ho" (suggerimento, non obbligatorio)
    if (!testo.includes("ho") && !testo.includes("Ho")) {
        if (!confirm("⚠️ La tua frase non contiene 'ho'. Vuoi continuare lo stesso?")) {
            return;
        }
    }
    
    // Controlla se esiste già una risposta (per sapere se è una modifica)
    const refRisposta = ref(db, `${BASE_PATH}/scrittura_cose_importanti/${campoId}/${myUserName}`);
    get(refRisposta).then((snapshot) => {
        const esistente = snapshot.val();
        
        // Se esiste già, mantieni lo stato "attesa" (perché lo studente ha modificato)
        // Se non esiste, crea una nuova risposta
        set(refRisposta, {
            testo: testo,
            author: myUserName,
            stato: esistente ? 'attesa' : 'attesa',  // Sempre "attesa" dopo una modifica
            timestamp: Date.now()
        });
    }).catch((error) => {
        console.error("Errore durante il salvataggio:", error);
        alert("Errore durante il salvataggio. Riprova.");
    });
};
        

// Modifica risposta (lo studente modifica il testo esistente)
window.modificaRispostaScrittura = function(campoId, placeholder) {
    // Leggi la risposta esistente per precompilare il campo
    const refRisposta = ref(db, `${BASE_PATH}/scrittura_cose_importanti/${campoId}/${myUserName}`);
    
    get(refRisposta).then((snapshot) => {
        const data = snapshot.val();
        const testoEsistente = data ? data.testo || '' : '';
        
        // Trova il blocco e sostituisci con l'input precompilato
        const blocco = document.getElementById(`blocco_dinamico_scrittura_${campoId}`);
        if (!blocco) {
            console.error("Blocco non trovato:", `blocco_dinamico_scrittura_${campoId}`);
            return;
        }
        
        // Sostituisci il contenuto con un campo di input precompilato
        blocco.innerHTML = `
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; width: 100%;">
            <input type="text" id="input_scrittura_${campoId}" 
                   class="input-didattico" 
                   placeholder="${placeholder || 'Scrivi la tua risposta...'}" 
                   value="${testoEsistente.replace(/"/g, '&quot;')}"
                   style="flex: 1; min-width: 200px; padding: 8px 12px; font-size: 0.95em;">
            <button onclick="inviaRispostaScrittura('${campoId}')" 
                    class="btn-submit" 
                    style="padding: 8px 16px; font-size: 0.9em;">
                💾 Salva modifica
            </button>
            <button onclick="annullaModificaScrittura('${campoId}')" 
                    style="background: #95a5a6; color: white; border: none; border-radius: 4px; padding: 8px 16px; cursor: pointer; font-size: 0.85em;">
                ❌ Annulla
            </button>
        </div>
        `;
        
        // Focus sul campo di input
        const input = document.getElementById(`input_scrittura_${campoId}`);
        if (input) {
            input.focus();
            input.setSelectionRange(input.value.length, input.value.length);

// Genera coppie - TUTTE le combinazioni (A↔B, A↔C, B↔C, ...)
window.generaCoppie = function() {
    const partecipantiRef = ref(db, `${BASE_PATH}/fase_orale/partecipanti`);
    get(partecipantiRef).then((snapshot) => {
        const partecipanti = snapshot.val() || [];
        
        if (partecipanti.length < 2) {
            alert("Serve almeno 2 partecipanti per generare le coppie!");
            return;
        }
        
        // Mescola i partecipanti per varietà
        const shuffled = [...partecipanti];
        for (let i = shuffled.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
        }
        
        // Genera TUTTE le combinazioni possibili (A↔B, A↔C, B↔C, ...)
        const turni = [];
        let turnoId = 0;
        
        for (let i = 0; i < shuffled.length; i++) {
            for (let j = i + 1; j < shuffled.length; j++) {
                // Determina chi inizia a parlare (alternato per varietà)
                const iniziaA = (turnoId % 2 === 0);
                
                turni.push({
                    id: turnoId,
                    coppia: [shuffled[i], shuffled[j]],
                    stato: turnoId === 0 ? 'in_corso' : 'attesa',
                    fase: turnoId === 0 ? (iniziaA ? 'primo_parla' : 'secondo_parla') : 'attesa',
                    chiChiede: turnoId === 0 ? (iniziaA ? shuffled[i] : shuffled[j]) : null,
                    chiRisponde: turnoId === 0 ? (iniziaA ? shuffled[j] : shuffled[i]) : null,
                    primo: shuffled[i],
                    secondo: shuffled[j]
                });
                turnoId++;
            }
        }
        
        // Salva su Firebase
        set(ref(db, `${BASE_PATH}/fase_orale/turni`), turni);
        set(ref(db, `${BASE_PATH}/fase_orale/turno_corrente`), 0);
        
        // Mostra il pulsante "Prossimo turno"
        const btnProssimo = document.getElementById('btn_prossimo_turno');
        if (btnProssimo) btnProssimo.style.display = 'inline-block';
        
        console.log(`✅ Generati ${turni.length} turni per ${partecipanti.length} studenti`);
    });
};

// Prossimo turno - passa direttamente alla prossima coppia
window.prossimoTurno = function() {
    const turniRef = ref(db, `${BASE_PATH}/fase_orale/turni`);
    get(turniRef).then((snapshot) => {
        const turni = snapshot.val() || [];
        
        // Trova il turno corrente
        const indexCorrente = turni.findIndex(t => t.stato === 'in_corso');
        
        if (indexCorrente === -1) {
            // Se non c'è un turno in corso, inizia dal primo
            if (turni.length > 0) {
                turni[0].stato = 'in_corso';
                set(turniRef, turni);
            }
            return;
        }
        
        // Completa il turno corrente
        turni[indexCorrente].stato = 'completato';
        
        // Passa al prossimo (se esiste)
        if (indexCorrente + 1 < turni.length) {
            turni[indexCorrente + 1].stato = 'in_corso';
        }
        
        set(turniRef, turni);
    });
};

// Genera una domanda da una frase
function generaDomandaDaFrase(frase, compagno) {
    if (!frase) return `${compagno}, fai una domanda usando la tua frase!`;
    
    // Estrai il contenuto dopo "Io ho"
    const match = frase.match(/Io ho (.+)/i);
    if (!match) return `${compagno}, fai una domanda usando la tua frase!`;
    
    const contenuto = match[1].trim();
    
    // Rimuovi la descrizione (dopo la virgola o il punto)
    const oggetto = contenuto.split(',')[0].split('.')[0].trim();
    
    // Crea la domanda
    return `${compagno}, tu hai ${oggetto}?`;
}

window.verificaAbbinamenti = function() {
    const pa = ConfigLezione?.profiloAnonimo;
    if (!pa || !pa.abbinamento) return;
    
    const profili = pa.abbinamento.profili;
    let corretti = 0;
    let totali = profili.length;
    let risultati = []; // Array per salvare i risultati (true/false) in ordine
    
    profili.forEach(p => {
        const select = document.getElementById(`abbinamento_${p.id}`);
        const feedback = document.getElementById(`feedback_abbinamento_${p.id}`);
        if (!select || !feedback) return;
        
        const scelta = select.value;
        const corretta = p.rispostaCorretta;
        
        if (scelta === "") {
            feedback.innerHTML = '<span style="color: #f39c12;">⚠️ Scegli un\'opzione!</span>';
            feedback.style.color = '#f39c12';
            return;
        }
        
        if (scelta === corretta) {
            feedback.innerHTML = '✅ Corretto!';
            feedback.style.color = '#27ae60';
            select.style.borderColor = '#27ae60';
            select.style.backgroundColor = '#d4edda';
            corretti++;
            risultati.push(true);
        } else {
            feedback.innerHTML = `❌ Sbagliato. La risposta corretta era ${corretta}.`;
            feedback.style.color = '#e74c3c';
            select.style.borderColor = '#e74c3c';
            select.style.backgroundColor = '#f8d7da';
            risultati.push(false);
        }
    });
    
    // 🔥 SALVA I RISULTATI SU FIREBASE (per il pannello del docente)
    set(ref(db, `${BASE_PATH}/profilo_anonimo/risultati_abbinamenti/${myUserName}`), {
        risultati: risultati,
        corretti: corretti,
        totali: totali,
        timestamp: Date.now()
    });
    
    // Feedback complessivo
    const container = document.querySelector('.didactic-block');
    let msgComplessivo = document.getElementById('feedback_complessivo_abbinamento');
    if (!msgComplessivo) {
        msgComplessivo = document.createElement('div');
        msgComplessivo.id = 'feedback_complessivo_abbinamento';
        msgComplessivo.style.cssText = 'margin-top: 15px; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; font-size: 1.1em;';
        container.appendChild(msgComplessivo);
    }
    
    if (corretti === totali) {
        msgComplessivo.innerHTML = '🎉 Perfetto! Hai abbinato tutti i profili correttamente!';
        msgComplessivo.style.background = '#d4edda';
        msgComplessivo.style.color = '#155724';
        msgComplessivo.style.border = '2px solid #28a745';
    } else {
        msgComplessivo.innerHTML = `📊 Hai ${corretti} su ${totali} corretti. ${corretti < totali ? 'Riprova!' : 'Ottimo lavoro!'}`;
        msgComplessivo.style.background = '#fff3cd';
        msgComplessivo.style.color = '#856404';
        msgComplessivo.style.border = '2px solid #f1c40f';
    }
};

window.salvaProfiloAnonimo = function() {
    const eta = document.getElementById('input_profilo_eta').value.trim();
    
    if (eta === "" || isNaN(eta)) {
        document.getElementById('feedback_profilo').innerHTML = '<span style="color: #e74c3c;">⚠️ Inserisci la tua età in cifre!</span>';
        return;
    }
    
    const campiCheckbox = ['fratello', 'sorella', 'figlio', 'figlia', 'cane', 'gatto', 'macchina', 'bicicletta', 'fame', 'sete', 'freddo', 'sonno'];
    const dati = {
        eta: parseInt(eta),
        timestamp: Date.now()
    };
    
    campiCheckbox.forEach(id => {
        const checkbox = document.getElementById(`input_profilo_${id}`);
        dati[id] = checkbox ? checkbox.checked : false;
    });
    
    const profiloRef = ref(db, `${BASE_PATH}/profilo_anonimo/profili/${myUserName}`);
    set(profiloRef, dati).then(() => {
        document.getElementById('feedback_profilo').innerHTML = '<span style="color: #27ae60;">✅ Profilo salvato con successo!</span>';
        const btn = document.querySelector('button[onclick="salvaProfiloAnonimo()"]');
        if (btn) {
            btn.disabled = true;
            btn.style.opacity = '0.6';
            btn.textContent = '✅ Profilo salvato';
        }
    }).catch((error) => {
        console.error("Errore durante il salvataggio:", error);
        document.getElementById('feedback_profilo').innerHTML = '<span style="color: #e74c3c;">❌ Errore durante il salvataggio. Riprova.</span>';
    });
};

onValue(ref(db, `${BASE_PATH}/profilo_anonimo/profili`), (snapshot) => {
    const data = snapshot.val();
    const container = document.getElementById('container_profili_anonimi');
    if (!container) return;
    
    if (!data || Object.keys(data).length === 0) {
        container.innerHTML = '<p style="grid-column: 1 / -1; color: #999; font-style: italic;">⏳ Nessun profilo salvato. Aspetta che gli studenti compilino i loro profili.</p>';
        return;
    }
    
    // 🔥 Recupera le ipotesi già salvate per lo studente corrente
    let ipotesiSalvate = {};
    const ipotesiRef = ref(db, `${BASE_PATH}/profilo_anonimo/ipotesi`);
    get(ipotesiRef).then((snapshotIpotesi) => {
        const ipotesiData = snapshotIpotesi.val() || {};
        
        // Estrai le ipotesi dello studente corrente
        Object.keys(ipotesiData).forEach(profiloId => {
            if (ipotesiData[profiloId][myUserName]) {
                ipotesiSalvate[profiloId] = ipotesiData[profiloId][myUserName].ipotesi;
            }
        });
        
        // 🔥 FILTRA: escludi il profilo dello studente corrente
        let profiliArray = Object.keys(data)
            .filter(key => key !== myUserName)  // ← esclude il proprio profilo
            .map(key => ({ id: key, ...data[key] }));
        
        // Se lo studente non ha profili da vedere
        if (profiliArray.length === 0) {
            container.innerHTML = '<p style="grid-column: 1 / -1; color: #999; font-style: italic;">⏳ Non ci sono altri profili da indovinare. Aspetta che altri studenti partecipino!</p>';
            return;
        }
        
        // Ordina casualmente per l'anonimato
        for (let i = profiliArray.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [profiliArray[i], profiliArray[j]] = [profiliArray[j], profiliArray[i]];
        }
        
        let html = '';
        profiliArray.forEach((profilo, index) => {
            let testoProfilo = `Ho ${profilo.eta} anni. `;
            const checkItems = ['fratello', 'sorella', 'figlio', 'figlia', 'cane', 'gatto', 'macchina', 'bicicletta', 'fame', 'sete', 'freddo', 'sonno'];

                sorella: 'ho una sorella',
                figlio: 'ho un figlio',
                figlia: 'ho una figlia',
                cane: 'ho un cane',
                gatto: 'ho un gatto',
                macchina: 'ho una macchina',
                bicicletta: 'ho una bicicletta',
                fame: 'ho fame',
                sete: 'ho sete',
                freddo: 'ho freddo',
                sonno: 'ho sonno'
            };
            const items = [];
            checkItems.forEach(id => {
                if (profilo[id]) {
                    items.push(traduzioni[id]);
                }
            });
            testoProfilo += items.join('. ') + '.';
            if (items.length === 0) {
                testoProfilo += ' Non ho selezionato nulla.';
            }
            
            const ipotesiPrecedente = ipotesiSalvate[profilo.id] || '';
            const disabled = ipotesiPrecedente !== '' ? 'disabled' : '';
            
            html += `
            <div style="background: white; border-radius: 12px; padding: 15px; border: 2px solid #9b59b6; box-shadow: 0 2px 8px rgba(0,0,0,0.08);">
                <div style="font-size: 1em; color: #2c3e50; margin-bottom: 10px; font-weight: bold;">

                </div>
                <div style="font-size: 1.1em; color: #2c3e50; padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 10px;">
                    ${testoProfilo}
                </div>
                <div style="margin-top: 10px;">
                    <label style="font-weight: bold; font-size: 0.9em;">🔍 Secondo me è:</label>
                    <input type="text" id="ipotesi_${index}" 
                           class="input-didattico" 
                           placeholder="Scrivi il nome dello studente..."
                           style="width: 100%; margin-top: 5px; padding: 6px 12px; border: 2px solid #ddd; border-radius: 6px; font-size: 0.95em;"
                           value="${ipotesiPrecedente}"
                           ${disabled}>

                            style="margin-top: 5px; background: #9b59b6; color: white; border: none; border-radius: 4px; padding: 4px 12px; cursor: pointer; font-size: 0.85em;

                        ${ipotesiPrecedente ? '<span style="color: #27ae60;">✅ Ipotesi salvata!</span>' : ''}

window.resetProfiloAnonimo = function() {
    if (!isDocente) {
        alert("Solo il docente può resettare l'attività!");
        return;
    }
    
    if (!confirm("⚠️ ATTENZIONE: Questa operazione cancellerà TUTTI i profili, le ipotesi, i punteggi e la rivelazione. Continuare?")) {
        return;
    }
    
    // 🔥 Cancella TUTTI i dati dell'attività 2
    const refsToDelete = [
        ref(db, `${BASE_PATH}/profilo_anonimo/profili`),
        ref(db, `${BASE_PATH}/profilo_anonimo/ipotesi`),
        ref(db, `${BASE_PATH}/profilo_anonimo/punteggi`),
        ref(db, `${BASE_PATH}/profilo_anonimo/rivelato`)
    ];
    
    // Esegui tutte le cancellazioni in parallelo
    Promise.all(refsToDelete.map(r => remove(r)))
        .then(() => {
            console.log("✅ Tutti i dati dell'attività 2 sono stati resettati!");
            
            // 🔄 Resetta l'UI
            // 1. Nascondi il wrapper della rivelazione
            const wrapper = document.getElementById('container_rivelazione_wrapper');
            if (wrapper) wrapper.style.display = 'none';
            
            // 2. Pulisci i container
            const rivelazione = document.getElementById('container_rivelazione');
            if (rivelazione) rivelazione.innerHTML = '';
            
            const classifica = document.getElementById('container_classifica');
            if (classifica) {
                classifica.innerHTML = '';
                classifica.style.display = 'none';
            }
            
            // 3. Rimuovi il feedback personale
            const feedback = document.getElementById('feedback_personale');
            if (feedback) feedback.remove();
            
            // 4. Mostra il messaggio di attesa agli studenti
            const msgAttesa = document.getElementById('messaggio_attesa_studenti');
            if (msgAttesa) msgAttesa.style.display = 'block';
            
            // 5. Ripristina i campi del profilo (per gli studenti)
            const profiloEta = document.getElementById('input_profilo_eta');
            if (profiloEta) profiloEta.value = '';
            
            // Deseleziona tutti i checkbox
            document.querySelectorAll('[id^="input_profilo_"]').forEach(el => {
                if (el.type === 'checkbox') el.checked = false;
            });
            
            // 6. Ripristina i campi delle ipotesi
            document.querySelectorAll('[id^="ipotesi_"]').forEach(el => {
                el.value = '';
                el.disabled = false;
            });
            
            // 7. Ripristina i feedback delle ipotesi
            document.querySelectorAll('[id^="feedback_ipotesi_"]').forEach(el => {
                el.innerHTML = '';
            });
            
            // 8. Nascondi le rivelazioni individuali
            document.querySelectorAll('[id^="rivelazione_"]').forEach(el => {
                el.style.display = 'none';
            });
            
            // 9. Resetta i pulsanti "Salva ipotesi"
            document.querySelectorAll('button[onclick*="salvaIpotesi"]').forEach(btn => {
                btn.disabled = false;
                btn.style.opacity = '1';
            });
            
            // 10. Riabilita il pulsante "Salva profilo"
            const btnSalva = document.querySelector('button[onclick="salvaProfiloAnonimo()"]');
            if (btnSalva) {
                btnSalva.disabled = false;
                btnSalva.style.opacity = '1';
                btnSalva.textContent = '💾 Salva profilo';
            }
            
            // 11. Rimuovi il feedback del profilo
            const feedbackProfilo = document.getElementById('feedback_profilo');
            if (feedbackProfilo) feedbackProfilo.innerHTML = '';
            
            // 12. Mostra il messaggio "Nessun profilo" nei container
            const profiliContainer = document.getElementById('container_profili_anonimi');
            if (profiliContainer) {
                profiliContainer.innerHTML = '<p style="grid-column: 1 / -1; color: #999; font-style: italic;">⏳ Nessun profilo salvato. Aspetta che gli studenti compilino i loro profili.</p>';
            }
            
            // 13. Pulisci il pannello docente degli abbinamenti
            const pannelloDocente = document.getElementById('pannello_docente_abbinamenti');
            if (pannelloDocente) {
                pannelloDocente.innerHTML = '<p style="color: #999; font-style: italic;">⏳ Caricamento risultati...</p>';
            }
            
            alert("✅ Reset completato! Tutti i dati dell'attività sono stati cancellati.");
        })
        .catch((error) => {
            console.error("❌ Errore durante il reset:", error);
            alert("❌ Errore durante il reset. Controlla la console per i dettagli.");
        });
};

// ==========================================

function calcolaPunteggi() {
    const profiliRef = ref(db, `${BASE_PATH}/profilo_anonimo/profili`);
    const ipotesiRef = ref(db, `${BASE_PATH}/profilo_anonimo/ipotesi`);
    
    Promise.all([get(profiliRef), get(ipotesiRef)]).then(([profiliSnap, ipotesiSnap]) => {
        const profili = profiliSnap.val() || {};
        const ipotesi = ipotesiSnap.val() || {};
        
        const punteggi = {};
        Object.keys(ipotesi).forEach(profiloId => {
            const ipotesiProfilo = ipotesi[profiloId];
            Object.keys(ipotesiProfilo).forEach(studente => {
                const nomeIpotesi = ipotesiProfilo[studente].ipotesi;
                if (nomeIpotesi === profiloId) {
                    punteggi[studente] = (punteggi[studente] || 0) + 1;
                }
            });
        });
        
        set(ref(db, `${BASE_PATH}/profilo_anonimo/punteggi`), punteggi);
        mostraFeedbackStudente(punteggi);
        mostraClassifica(punteggi);
    }).catch(error => {
        console.error("Errore durante il calcolo dei punteggi:", error);
    });
}

function mostraFeedbackStudente(punteggi) {
    const punteggio = punteggi[myUserName] || 0;
    const totali = Object.keys(punteggi).length;
    
    let msg = '';
    if (punteggio === 0) {
        msg = '😅 Non hai indovinato nessun profilo. La prossima volta andrà meglio!';
    } else if (punteggio === 1) {
        msg = '👍 Hai indovinato 1 profilo! Continua così!';
    } else if (punteggio <= 3) {
        msg = `🎯 Hai indovinato ${punteggio} profili! Ottimo lavoro!`;
    } else {
        msg = `🏆 ${punteggio} profili indovinati! Sei un vero detective!`;
    }
    
    let feedbackDiv = document.getElementById('feedback_personale');
    if (!feedbackDiv) {
        feedbackDiv = document.createElement('div');
        feedbackDiv.id = 'feedback_personale';
        feedbackDiv.style.cssText = 'margin: 20px 0; padding: 20px; border-radius: 12px; text-align: center; font-size: 1.2em; font-weight: bold; background: #d4edda; border: 2px solid #28a745; color: #155724;';
        const container = document.querySelector('.didactic-block');
        if (container) {
            // Inserisci dopo il pulsante "Rivela" o in fondo
            const wrapper = document.getElementById('container_rivelazione_wrapper');
            if (wrapper) {
                wrapper.appendChild(feedbackDiv);
            } else {
                container.appendChild(feedbackDiv);
            }
        }
    }
    if (feedbackDiv) {
        feedbackDiv.innerHTML = `
            <p style="margin: 0;">📊 Hai indovinato <strong>${punteggio}</strong> profili su ${totali}!</p>
            <p style="margin: 5px 0 0 0; font-size: 0.9em; color: #155724;">${msg}</p>
            <p style="margin: 10px 0 0 0; font-size: 1.3em;">🎉 Bravi a tutti!</p>
        `;
    }
}

function mostraClassifica(punteggi) {
    const container = document.getElementById('container_classifica');
    if (!container) return;
    
    const classifica = Object.keys(punteggi)
        .sort((a, b) => punteggi[b] - punteggi[a])
        .map(nome => ({ nome, punteggio: punteggi[nome] }));
    
    if (classifica.length === 0) {
        container.innerHTML = '<p style="color: #999; font-style: italic;">Nessun punteggio disponibile.</p>';
        return;
    }
    
    let html = `
    <div style="margin-top: 15px; padding: 15px; background: white; border-radius: 12px; border: 2px solid #f1c40f;">
        <h4 style="text-align: center; color: #2c3e50; margin-top: 0;">🏆 Classifica</h4>
        <table style="width: 100%; border-collapse: collapse; font-size: 0.95em;">
            <thead>
                <tr style="background: #34495e; color: white;">
                    <th style="padding: 10px; text-align: left; border-radius: 4px 0 0 0;">#</th>
                    <th style="padding: 10px; text-align: left;">Studente</th>
                    <th style="padding: 10px; text-align: center; border-radius: 0 4px 4px 0;">🎯 Punteggio</th>
                </tr>
            </thead>
            <tbody>
                ${classifica.map((item, index) => `
                    <tr style="${index === 0 ? 'background: #fff9e6;' : ''} ${index % 2 === 0 ? 'background: #f8f9fa;' : 'background: white;'}">
                        <td style="padding: 8px 10px; border-bottom: 1px solid #eee; font-weight: bold;">${index + 1}</td>
                        <td style="padding: 8px 10px; border-bottom: 1px solid #eee;">${item.nome} ${index === 0 ? '🥇' : ''}</td>
                        <td style="padding: 8px 10px; border-bottom: 1px solid #eee; text-align: center; font-weight: bold;">${item.punteggio}</td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
        <p style="text-align: center; margin-top: 15px; font-size: 1.1em; color: #2c3e50;">🎉 Bravi a tutti!</p>
    </div>
    `;
    
    container.innerHTML = html;
    container.style.display = 'block';
}

window.verificaCloze = function() {
    const ea = ConfigLezione?.essereAvereCloze;
    if (!ea) return;
    
    let corretti = 0;
    let totali = 0;
    let tuttiCompilati = true;
    
    ea.esercizi.forEach((ex, index) => {
        const isMultipla = Array.isArray(ex.risposta);
        const risposteCorrette = isMultipla ? ex.risposta : [ex.risposta];
        const feedback = document.getElementById(`feedback_cloze_${ex.id}`);
        let tuttiRisposte = true;
        let erroriLocali = 0;
        
        if (isMultipla) {
            // Controlla ogni input per le risposte multiple
            let risultati = [];
            for (let i = 0; i < risposteCorrette.length; i++) {
                const input = document.getElementById(`cloze_${ex.id}_${i}`);
                if (!input) continue;
                const valore = input.value.trim().toLowerCase();
                if (valore === "") {
                    tuttiRisposte = false;
                    tuttiCompilati = false;
                    input.style.borderColor = '#f39c12';
                    input.style.backgroundColor = '#fff3cd';
                    risultati.push('vuoto');
                } else if (valore === risposteCorrette[i]) {
                    input.style.borderColor = '#28a745';
                    input.style.backgroundColor = '#d4edda';
                    risultati.push('corretto');
                } else {
                    input.style.borderColor = '#dc3545';
                    input.style.backgroundColor = '#f8d7da';
                    erroriLocali++;
                    risultati.push('errato');
                }
            }
            
            // Mostra feedback per l'esercizio
            if (erroriLocali === 0 && risultati.every(r => r === 'corretto')) {
                feedback.innerHTML = '<span style="color: #27ae60;">✅ Corretto!</span>';
                corretti++;
            } else if (risultati.some(r => r === 'vuoto')) {
                feedback.innerHTML = '<span style="color: #f39c12;">⚠️ Completa tutti i campi!</span>';
            } else {
                feedback.innerHTML = '<span style="color: #e74c3c;">❌ Qualcosa non torna. Riprova!</span>';
            }
            totali++;
            
        } else {
            // Risposta singola
            const input = document.getElementById(`cloze_${ex.id}`);
            if (!input) return;
            const valore = input.value.trim().toLowerCase();
            
            if (valore === "") {
                tuttiCompilati = false;
                input.style.borderColor = '#f39c12';
                input.style.backgroundColor = '#fff3cd';
                feedback.innerHTML = '<span style="color: #f39c12;">⚠️ Inserisci una risposta!</span>';
                return;
            }
            
            if (valore === risposteCorrette[0]) {
                input.style.borderColor = '#28a745';
                input.style.backgroundColor = '#d4edda';
                feedback.innerHTML = '<span style="color: #27ae60;">✅ Corretto!</span>';
                corretti++;
            } else {
                input.style.borderColor = '#dc3545';
                input.style.backgroundColor = '#f8d7da';
                feedback.innerHTML = `<span style="color: #e74c3c;">❌ Sbagliato. La risposta corretta era "${risposteCorrette[0]}".</span>`;
            }
            totali++;
        }
    });
    
    // Feedback complessivo
    const complessivo = document.getElementById('feedback_complessivo_cloze');
    if (complessivo) {
        if (corretti === totali && tuttiCompilati) {
            complessivo.innerHTML = `<span style="color: #27ae60; font-size: 1.2em;">🎉 Perfetto! Hai completato tutti gli esercizi correttamente!</span>`;
            complessivo.style.background = '#d4edda';
            complessivo.style.padding = '15px';
            complessivo.style.borderRadius = '8px';
        } else if (corretti > 0 && tuttiCompilati) {
            complessivo.innerHTML = `<span style="color: #f39c12; font-size: 1.1em;">📊 Hai ${corretti} su ${totali} corretti. ${corretti < totali ? 'Riprova!' : 'Ottimo lavoro!'}</span>`;
            complessivo.style.background = '#fff3cd';
            complessivo.style.padding = '15px';
            complessivo.style.borderRadius = '8px';
        } else if (!tuttiCompilati) {
            complessivo.innerHTML = `<span style="color: #f39c12; font-size: 1.1em;">⚠️ Completa tutti i campi prima di verificare!</span>`;
            complessivo.style.background = '#fff3cd';
            complessivo.style.padding = '15px';
            complessivo.style.borderRadius = '8px';
        } else {
            complessivo.innerHTML = `<span style="color: #e74c3c; font-size: 1.1em;">❌ Nessuna risposta corretta. Riprova!</span>`;
            complessivo.style.background = '#f8d7da';
            complessivo.style.padding = '15px';
            complessivo.style.borderRadius = '8px';
        }
    }
};

window.inviaCloze = function() {
    const ea = ConfigLezione?.essereAvereCloze;
    if (!ea) return;
    
    let tuttiCompilati = true;
    let risposte = {};
    
    ea.esercizi.forEach((ex) => {
        const isMultipla = Array.isArray(ex.risposta);
        
        if (isMultipla) {
            const valori = [];
            for (let i = 0; i < ex.risposta.length; i++) {
                const select = document.getElementById(`cloze_${ex.id}_${i}`);
                if (!select) continue;
                const valore = select.value;
                if (valore === "") tuttiCompilati = false;
                valori.push(valore);
            }
            risposte[ex.id] = valori;
        } else {
            const select = document.getElementById(`cloze_${ex.id}`);
            if (!select) return;
            const valore = select.value;
            if (valore === "") tuttiCompilati = false;
            risposte[ex.id] = valore;
        }
    });
    
    if (!tuttiCompilati) {
        document.getElementById('feedback_complessivo_cloze').innerHTML = 
            '<span style="color: #f39c12;">⚠️ Completa tutti i campi prima di inviare!</span>';
        return;
    }
    
    // Salva su Firebase
    const clozeRef = ref(db, `${BASE_PATH}/cloze_risposte/${myUserName}`);
    set(clozeRef, {
        risposte: risposte,
        timestamp: Date.now()
    }).then(() => {
        document.getElementById('feedback_complessivo_cloze').innerHTML = 
            '<span style="color: #27ae60;">✅ Risposte salvate! Guarda il feedback.</span>';
        
        // Feedback per ogni esercizio (verde/rosso)
        ea.esercizi.forEach((ex) => {
            const isMultipla = Array.isArray(ex.risposta);
            const rispostaSalvata = risposte[ex.id];
            
            if (isMultipla) {
                for (let i = 0; i < ex.risposta.length; i++) {
                    const select = document.getElementById(`cloze_${ex.id}_${i}`);
                    if (!select) continue;
                    const esatta = rispostaSalvata && rispostaSalvata[i] === ex.risposta[i];
                    select.style.borderColor = esatta ? '#28a745' : '#dc3545';
                    select.style.backgroundColor = esatta ? '#d4edda' : '#f8d7da';
                    
                    const feedbackEl = document.getElementById(`feedback_cloze_${ex.id}`);
                    if (feedbackEl) {
                        if (esatta) {
                            feedbackEl.innerHTML = '✅';
                            feedbackEl.style.color = '#27ae60';
                        } else {
                            feedbackEl.innerHTML = `
                                <div style="margin-top: 5px; padding: 8px 12px; background: #fff3cd; border-radius: 6px; border-left: 4px solid #f39c12; font-size: 0.9em; color: #2c3e50;">
                                    ❌ ${ex.spiegazione || 'Riprova!'}
                                </div>
                            `;
                            feedbackEl.style.color = '#2c3e50';
                        }
                    }
                }
            } else {
                const select = document.getElementById(`cloze_${ex.id}`);
                if (!select) return;
                const esatta = rispostaSalvata === ex.risposta;
                select.style.borderColor = esatta ? '#28a745' : '#dc3545';
                select.style.backgroundColor = esatta ? '#d4edda' : '#f8d7da';
                
                const feedbackEl = document.getElementById(`feedback_cloze_${ex.id}`);
                if (feedbackEl) {
                    if (esatta) {
                        feedbackEl.innerHTML = '✅';
                        feedbackEl.style.color = '#27ae60';
                    } else {
                        feedbackEl.innerHTML = `
                            <div style="margin-top: 5px; padding: 8px 12px; background: #fff3cd; border-radius: 6px; border-left: 4px solid #f39c12; font-size: 0.9em; color: #2c3e50;">
                                ❌ ${ex.spiegazione || 'Riprova!'}
                            </div>
                        `;
                        feedbackEl.style.color = '#2c3e50';
                    }
                }
            }
        });
        
    }).catch((error) => {
        console.error("Errore durante il salvataggio:", error);
        document.getElementById('feedback_complessivo_cloze').innerHTML = 
            '<span style="color: #e74c3c;">❌ Errore durante il salvataggio. Riprova.</span>';
    });
};

        return;
    }
    
    remove(ref(db, `${BASE_PATH}/cloze_risposte`)).then(() => {
        // Riabilita tutti i select
        document.querySelectorAll('#contenitore-dinamico select[id^="cloze_"]').forEach(sel => {
            sel.disabled = false;
            sel.value = "";
            sel.style.borderColor = '#ddd';
            sel.style.backgroundColor = 'white';
        });
        
        // Pulisci i feedback
        document.querySelectorAll('[id^="feedback_cloze_"]').forEach(el => {
            el.innerHTML = '';
        });
        
        // Riabilita il pulsante Invia
        const btnInvia = document.querySelector('button[onclick="inviaCloze()"]');
        if (btnInvia) {
            btnInvia.disabled = false;
            btnInvia.style.opacity = '1';
            btnInvia.textContent = '✅ Invia';
        }
        
        document.getElementById('feedback_complessivo_cloze').innerHTML = '';
        alert("✅ Risposte resettate! Gli studenti possono ora modificare le loro risposte.");
    }).catch((error) => {
        console.error("Errore durante il reset:", error);
        alert("❌ Errore durante il reset.");
    });
};

onValue(ref(db, `${BASE_PATH}/cloze_risposte/${myUserName}`), (snapshot) => {
    const data = snapshot.val();
    const ea = ConfigLezione?.essereAvereCloze;
    if (!ea) return;
    
    // Reset di tutti i campi allo stato iniziale
    ea.esercizi.forEach((ex) => {
        const isMultipla = Array.isArray(ex.risposta);
        
        if (isMultipla) {
            for (let i = 0; i < ex.risposta.length; i++) {
                const select = document.getElementById(`cloze_${ex.id}_${i}`);
                if (select) {
                    select.value = "";
                    select.disabled = false;
                    select.style.borderColor = '#ddd';
                    select.style.backgroundColor = 'white';
                }
            }
        } else {
            const select = document.getElementById(`cloze_${ex.id}`);
            if (select) {
                select.value = "";
                select.disabled = false;
                select.style.borderColor = '#ddd';
                select.style.backgroundColor = 'white';
            }
        }
        
        // Pulisci i feedback
        const feedbackEl = document.getElementById(`feedback_cloze_${ex.id}`);
        if (feedbackEl) {
            feedbackEl.innerHTML = '';
            feedbackEl.style.color = '';
        }
    });
    
    // Se non ci sono dati, esci
    if (!data || !data.risposte || Object.keys(data.risposte).length === 0) {
        return;
    }
    
    const risposte = data.risposte;
    
    // Popola i campi con le risposte salvate
    ea.esercizi.forEach((ex) => {
        const isMultipla = Array.isArray(ex.risposta);
        const rispostaSalvata = risposte[ex.id];
        
        if (rispostaSalvata === undefined || rispostaSalvata === null) {
            return;
        }
        
        if (isMultipla) {
            for (let i = 0; i < rispostaSalvata.length; i++) {
                const select = document.getElementById(`cloze_${ex.id}_${i}`);
                if (select) {
                    if (rispostaSalvata[i] && rispostaSalvata[i] !== "") {
                        select.value = rispostaSalvata[i];
                    }
                    select.style.borderColor = '#28a745';
                    select.style.backgroundColor = '#d4edda';
                }
            }
        } else {
            const select = document.getElementById(`cloze_${ex.id}`);
            if (select) {
                if (rispostaSalvata && rispostaSalvata !== "") {
                    select.value = rispostaSalvata;
                }
                select.style.borderColor = '#28a745';
                select.style.backgroundColor = '#d4edda';
            }
        }
    });
});

// ASCOLTATORE: Pannello docente
