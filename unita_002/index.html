if (isDocente) {
    onValue(ref(db, `${BASE_PATH}/cloze_risposte`), (snapshot) => {
        const data = snapshot.val();
        const container = document.getElementById('container_risposte_cloze');
        if (!container) return;
        
        const ea = ConfigLezione?.essereAvereCloze;
        if (!ea) return;
        
        // Se non ci sono risposte, mostra messaggio
        if (!data || Object.keys(data).length === 0) {
            container.innerHTML = '<p style="color: #999; font-style: italic;">⏳ Nessuna risposta ricevuta.</p>';
            return;
        }
        
        // 🔥 Prendi SOLO gli studenti che hanno risposto
        const studentiCheHannoRisposto = Object.keys(data).filter(nome => {
            // Verifica che lo studente abbia effettivamente risposto a qualcosa
            const risposte = data[nome]?.risposte;
            return risposte && Object.keys(risposte).length > 0;
        });
        
        if (studentiCheHannoRisposto.length === 0) {
            container.innerHTML = '<p style="color: #999; font-style: italic;">⏳ Nessuna risposta ricevuta.</p>';
            return;
        }
        
        let html = '';
        
        // Per ogni esercizio, crea una riga
        ea.esercizi.forEach((ex, index) => {
            const isMultipla = Array.isArray(ex.risposta);
            
            html += `
            <div style="background: white; border-radius: 8px; padding: 12px; margin-bottom: 10px; border: 1px solid #e9ecef;">
                <div style="font-weight: bold; color: #2c3e50; margin-bottom: 3px;">
                    ${index + 1}. ${ex.testo.replace(/_____/g, '___')}
                </div>
                <div style="font-size: 0.9em; color: #7f8c8d; margin-bottom: 10px; font-style: italic;">
                    📖 ${ex.spiegazione || ''}
                </div>
                <div style="overflow-x: auto;">
                    <table style="width: 100%; border-collapse: collapse; font-size: 0.9em;">
                        <thead>
                            <tr style="background: #f8f9fa;">
                                <th style="padding: 6px 10px; border: 1px solid #ddd; text-align: left; min-width: 100px;">Studente</th>
                                <th style="padding: 6px 10px; border: 1px solid #ddd; text-align: center;">Risultato</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            // 🔥 Mostra SOLO gli studenti che hanno risposto
            studentiCheHannoRisposto.forEach(nome => {
                const risposteStudente = data[nome] ? data[nome].risposte : null;
                let stato = '';
                let coloreStato = 'transparent';
                
                if (risposteStudente && risposteStudente[ex.id] !== undefined) {
                    const risposta = risposteStudente[ex.id];
                    let esatta = false;
                    
                    if (isMultipla) {
                        esatta = Array.isArray(risposta) && 
                                 risposta.length === ex.risposta.length && 
                                 risposta.every((v, i) => v === ex.risposta[i]);
                    } else {
                        esatta = risposta === ex.risposta;
                    }
                    
                    if (esatta) {
                        stato = '🟢';
                        coloreStato = '#27ae60';
                    } else {
                        stato = '🔴';
                        coloreStato = '#e74c3c';
                    }
                }
                
                html += `
                    <tr style="${index % 2 === 0 ? 'background: #f8f9fa;' : 'background: white;'}">
                        <td style="padding: 6px 10px; border: 1px solid #ddd;">${nome}</td>
                        <td style="padding: 6px 10px; border: 1px solid #ddd; text-align: center; font-size: 1.2em; color: ${coloreStato};">
                            ${stato}
                        </td>
                    </tr>
                `;
            });
            
            html += `
                        </tbody>
                    </table>
                </div>
            </div>
            `;
        });
        
        container.innerHTML = html;
    });
}

// ==========================================
// FUNZIONE: Modifica (libera solo le caselle rosse - solo docente)
// ==========================================

window.modificaCloze = function() {
    if (!isDocente) {
        alert("Solo il docente può modificare le risposte!");
        return;
    }
    
    if (!confirm("🔓 Vuoi liberare SOLO le caselle rosse (sbagliate) degli studenti?")) {
        return;
    }
    
    const ea = ConfigLezione?.essereAvereCloze;
    if (!ea) return;
    
    const clozeRef = ref(db, `${BASE_PATH}/cloze_risposte`);
    get(clozeRef).then((snapshot) => {
        const data = snapshot.val();
        if (!data) {
            alert("⚠️ Nessuna risposta da modificare.");
            return;
        }
        
        let contatore = 0;
        let promesse = [];
        let studentiDaPulire = [];
        
        Object.keys(data).forEach(studente => {
            const risposte = data[studente].risposte;
            if (!risposte) return;
            
            ea.esercizi.forEach((ex) => {
                const isMultipla = Array.isArray(ex.risposta);
                const rispostaSalvata = risposte[ex.id];
                
                if (rispostaSalvata === undefined || rispostaSalvata === null) return;
                
                let esatta = false;
                if (isMultipla) {
                    esatta = Array.isArray(rispostaSalvata) && 
                             rispostaSalvata.length === ex.risposta.length && 
                             rispostaSalvata.every((v, i) => v === ex.risposta[i]);
                } else {
                    esatta = rispostaSalvata === ex.risposta;
                }
                
                if (!esatta) {
                    const refRisposta = ref(db, `${BASE_PATH}/cloze_risposte/${studente}/risposte/${ex.id}`);
                    promesse.push(remove(refRisposta));
                    contatore++;
                    studentiDaPulire.push(studente);
                }
            });
        });
        
        if (contatore === 0) {
            alert("✅ Nessuna casella rossa da liberare! Tutte le risposte sono corrette.");
            return;
        }
        
        Promise.all(promesse).then(() => {
            // 🔥 Pulisci i nodi vuoti
            let pulizie = [];
            studentiDaPulire.forEach(studente => {
                const refStudente = ref(db, `${BASE_PATH}/cloze_risposte/${studente}`);
                pulizie.push(
                    get(refStudente).then((snap) => {
                        const dati = snap.val();
                        if (dati && dati.risposte) {
                            const risposteValide = Object.keys(dati.risposte).filter(key => 
                                dati.risposte[key] !== undefined && 
                                dati.risposte[key] !== null && 
                                dati.risposte[key] !== ""
                            );
                            if (risposteValide.length === 0) {
                                return remove(refStudente);
                            }
                        }
                        return Promise.resolve();
                    })
                );
            });
            
            return Promise.all(pulizie);
        }).then(() => {
            // 🔥 Aggiorna l'UI del docente
            document.querySelectorAll('#contenitore-dinamico select[id^="cloze_"]').forEach(sel => {
                const borderColor = sel.style.borderColor;
                if (borderColor === 'rgb(220, 53, 69)' || borderColor === '#dc3545') {
                    sel.disabled = false;
                    sel.value = "";
                    sel.style.borderColor = '#ddd';
                    sel.style.backgroundColor = 'white';
                    
                    const id = sel.id;
                    const feedbackId = id.replace(/cloze_([a-z0-9_]+)(?:_[0-9]+)?$/, 'feedback_cloze_$1');
                    const feedbackEl = document.getElementById(feedbackId);
                    if (feedbackEl) {
                        feedbackEl.innerHTML = '';
                        feedbackEl.style.color = '';
                    }
                }
            });
            
            // 🔥 Forza l'aggiornamento dell'ascoltatore per lo studente
            // Scrivendo un valore temporaneo e cancellandolo
            const tempRef = ref(db, `${BASE_PATH}/cloze_risposte/_temp_`);
            set(tempRef, { timestamp: Date.now() }).then(() => {
                remove(tempRef);
            });

         // 🔥 Riabilita il pulsante Invia per lo studente
riabilitaPulsanteInvia();
            
            alert(`🔓 Sono state liberate ${contatore} caselle rosse. Gli studenti possono ora correggere i loro errori!`);
            
        }).catch((error) => {
            console.error("Errore durante la pulizia:", error);
            alert("❌ Errore durante la modifica.");
        });
        
    }).catch((error) => {
        console.error("Errore durante la modifica:", error);
        alert("❌ Errore durante la modifica.");
    });
};

    if (btnInvia) {

        btnInvia.style.opacity = '1';
        btnInvia.textContent = '✅ Invia';
        console.log("Pulsante Invia riabilitato!");
    }
}
